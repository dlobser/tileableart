				<div id="info"  style="font-family:sans-serif;font-size:0em;color:gray;z-index:10;position:absolute">

					<span id="mouseInfoY">x: y:</span>

		<script src="lib/TREE.js"></script>
		<script src="lib/fungus.js"></script>

		<script src="lib/template.js"></script>

		<script>
			
			sc1 = {
			    
			    setup:function(){

			    	rebuildGui({sliders:7});
			    	invertBG();
			        
			        frameRate=1000/60;

			        tree = new TREE();
			        tree.branch(1000);
			        scene.add(tree);
			        tree.makeDictionary();
			        tree.rotation.z=-pi;
			        tree.position.x=0;

			        rootBranch = tree.makeList([0,0,-2])
			        rootRoot = tree.makeList([0,0,0])

			        imagesToSave = (Math.PI*2)/.2;
			        countUp=0;
			    },

			    draw:function(time){
			        
			        tree.applyFunc([
			            rootBranch, {rz:omouseX*.1,jFreq:omouseX,jMult:.091,jOff:count*-.02,jFract:.02,sc:1.003},
			            rootBranch, {rx:omouseY*.1},

			            // rootRoot, {rz:0,jFreq:.4,jMult:-.3,jOff:omouseX*5+time}

			        ],tree.transform)

			        if(varE){
			            saveIMG("sine_"+count+".png");
			            countUp++;
			            if(countUp>imagesToSave){
			                countUp=0;
			                varE = false;
			            }
			        }
			        
			    }
			}




			window.onload=function(){reinit();dat.GUI.toggleHide()};

	</script>


	</body>
